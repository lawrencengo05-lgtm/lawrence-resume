<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#F2EAD5"/>

  <!-- Gold dash + eyebrow -->
  <line x1="80" y1="120" x2="120" y2="120" stroke="#A88542" stroke-width="2"/>
  <text x="140" y="126" font-family="JetBrains Mono, Menlo, monospace" font-size="20" font-weight="500" fill="#A88542" letter-spacing="2">NETWORK ENGINEER · SEATTLE</text>

  <!-- Headline -->
  <text x="80" y="280" font-family="Georgia, 'Source Serif 4', serif" font-size="92" font-weight="500" fill="#15110D" letter-spacing="-2">Lawrence Ngo</text>

  <!-- Sub-headline with italic red phrase -->
  <text x="80" y="380" font-family="Georgia, 'Source Serif 4', serif" font-size="42" font-weight="500" fill="#15110D">From clinical systems to</text>
  <text x="80" y="430" font-family="Georgia, 'Source Serif 4', serif" font-size="42" font-weight="500" fill="#D5001C" font-style="italic">cloud networks.</text>

  <!-- LN monogram in corner -->
  <rect x="1040" y="60" width="100" height="100" rx="16" fill="#15110D"/>
  <text x="1090" y="135" font-family="Georgia, 'Source Serif 4', serif" font-size="56" font-weight="500" fill="#F2EAD5" text-anchor="middle">LN</text>

  <!-- URL footer -->
  <text x="80" y="560" font-family="JetBrains Mono, Menlo, monospace" font-size="22" fill="#6B5E48">lawrence-ngo.com</text>
</svg>